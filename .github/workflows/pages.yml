name: Publish Pattern Lab

on:
    push:
        branches: [main]
        paths:
            - 'docs/learning-lab.html'
            - 'docs/assets/**'
            - 'docs/BIG_O.md'
            - 'src/main/java/**'
            - 'scripts/*learning*.cjs'
            - '.github/workflows/pages.yml'
    pull_request:
        paths:
            - 'docs/learning-lab.html'
            - 'docs/assets/**'
            - 'docs/BIG_O.md'
            - 'src/main/java/**'
            - 'scripts/*learning*.cjs'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            - name: Verify Java and browser parity
              run: node scripts/test-learning-parity.cjs
            - name: Verify teaching models
              run: node scripts/test-learning-lab.cjs
            - name: Package the static site
              run: node scripts/build-learning-site.cjs
            - name: Upload site artifact
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: .cache/pages-site

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@v5
            - name: Deploy Pattern Lab
              id: deployment
              uses: actions/deploy-pages@v4
