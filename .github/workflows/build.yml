name: Java build
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                java: ['8', '17', '21']
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ matrix.java }}
                  cache: maven
            - run: sh ./mvnw --batch-mode --no-transfer-progress verify
